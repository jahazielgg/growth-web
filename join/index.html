<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#d7f99b">
<title>Growth · Invitación</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/styles/portal.css">
</head>
<body>
<div class="page">
  <a class="brand" href="https://growthapp.me"><img src="../assets/apple-touch-icon.png" alt="">Growth</a>
  <main class="stage">
    <h1 id="title">Te invitaron a un grupo en Growth</h1>
    <p class="lead" id="lead">Ábrelo en Growth para unirte. Cada uno anota con su tarjeta; todos ven lo que costó.</p>
    <section class="card">
      <img class="sprout" src="../assets/grow/sprout.png" alt="">
      <div class="pair" aria-hidden="true">
        <span class="logo app"><img src="../assets/apple-touch-icon.png" alt=""></span>
        <span class="plus">+</span>
        <span class="logo"><svg viewBox="0 0 24 24" width="30" height="30" fill="#0f3d27" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM9 13c-3 0-6 1.5-6 4v2h12v-2c0-2.5-3-4-6-4Zm7.2.2c2.6.3 4.8 1.6 4.8 3.8v2h-4v-2c0-1.4-.3-2.7-.8-3.8Z"/></svg></span>
      </div>
      <a class="pill" id="open" href="#"><span id="openLabel">Abrir en Growth</span><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></i></a>
    </section>
  </main>
</div>
<script>
(() => {
  // La clave del grupo viene en el fragmento (#): no sale de este teléfono.
  const en = !navigator.language.toLowerCase().startsWith("es");
  const fragment = location.hash.slice(1);
  const params = new URLSearchParams(fragment);
  const name = (params.get("n") || "").slice(0, 64);
  const open = document.getElementById("open");
  document.documentElement.lang = en ? "en" : "es";
  document.getElementById("title").textContent = name
    ? (en ? `You're invited to ${name} on Growth` : `Te invitaron a ${name} en Growth`)
    : (en ? "You're invited to a group on Growth" : "Te invitaron a un grupo en Growth");
  document.getElementById("lead").textContent = en
    ? "Open it in Growth to join. Everyone logs with their own card; everyone sees what it cost."
    : "Ábrelo en Growth para unirte. Cada uno anota con su tarjeta; todos ven lo que costó.";
  document.getElementById("openLabel").textContent = en ? "Open in Growth" : "Abrir en Growth";
  if (!params.get("s") || !params.get("k")) { open.style.display = "none"; return; }
  const link = `growth://join?${fragment}`;
  open.href = link;
  history.replaceState(null, "", location.pathname);
  location.href = link;
})();
</script>
</body>
</html>
