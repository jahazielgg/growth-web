<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d7f99b">
<title>Growth · Conectar</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/styles/portal.css">
</head>
<body>
<div class="page">
  <a class="brand" href="https://growthapp.me"><img src="../assets/apple-touch-icon.png" alt="">Growth</a>
  <main class="stage">
    <h1 id="title">Conectar con Growth</h1>
    <p class="lead" id="lead">Apruébalo en Growth, en tu iPhone o Mac. Ahí eliges qué puede ver y hacer.</p>

    <section class="card">
      <img class="sprout" src="../assets/grow/sprout.png" alt="">
      <div class="card-grid">
        <div>
          <div class="pair" aria-hidden="true">
            <span class="logo" id="assistant"></span>
            <span class="plus">+</span>
            <span class="logo app"><img src="../assets/apple-touch-icon.png" alt=""></span>
          </div>
          <p class="label" id="codeLabel">Tu código</p>
          <div class="code" id="code" role="text"></div>
          <ol class="steps" id="steps"></ol>
          <a class="pill" id="open" href="#"><span id="openLabel">Abrir Growth</span><i><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></i></a>
        </div>
        <div class="qr" aria-hidden="true">
          <div class="qr-box" id="qr"></div>
          <span id="qrLabel">Escanéalo con tu iPhone</span>
        </div>
      </div>
    </section>

    <p class="state" id="state" data-kind="wait" role="status"><span class="dot"></span><span id="stateText">Esperando tu permiso…</span></p>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const en = !navigator.language.toLowerCase().startsWith("es");
  const t = en ? {
    title: (n) => `Connect ${n} to Growth`, lead: "Approve it in Growth on your iPhone or Mac. That's where you choose what it can see and do.",
    code: "Your code", qr: "Scan it with your iPhone",
    steps: ["Scan the QR with your iPhone camera.", "Or open Growth › More › Claude and ChatGPT and type the code."],
    open: "Open Growth", wait: "Waiting for your approval…", ok: "Connected. Taking you back…",
    no: "Not allowed. Taking you back…", gone: "This code expired. Start again from your assistant.",
  } : {
    title: (n) => `Conectar ${n} con Growth`, lead: "Apruébalo en Growth, en tu iPhone o Mac. Ahí eliges qué puede ver y hacer.",
    code: "Tu código", qr: "Escanéalo con tu iPhone",
    steps: ["Escanea el QR con la cámara del iPhone.", "O abre Growth › Más › Claude y ChatGPT y escribe el código."],
    open: "Abrir Growth", wait: "Esperando tu permiso…", ok: "Conectado. Volviendo…",
    no: "No se permitió. Volviendo…", gone: "Este código venció. Vuelve a empezar desde tu asistente.",
  };
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const id = params.get("a"), code = params.get("c") || "", name = (params.get("n") || "tu asistente").slice(0, 80);
  const api = params.get("api") || "";

  const setState = (kind) => {
    $("state").dataset.kind = kind;
    $("stateText").textContent = t[kind === "wait" ? "wait" : kind];
  };

  document.documentElement.lang = en ? "en" : "es";
  $("title").textContent = t.title(name);
  document.title = t.title(name);
  $("lead").textContent = t.lead;
  $("codeLabel").textContent = t.code;
  $("qrLabel").textContent = t.qr;
  $("openLabel").textContent = t.open;
  $("steps").innerHTML = t.steps.map((s, i) => `<li><b>${i + 1}</b><span></span></li>`).join("");
  [...$("steps").querySelectorAll("span")].forEach((el, i) => { el.textContent = t.steps[i]; });

  // El logo del asistente si es uno conocido; si no, su inicial.
  const lower = name.toLowerCase(), mark = $("assistant");
  const logo = lower.includes("claude") ? ["claude", "../assets/claude-logo.png"]
    : (lower.includes("chatgpt") || lower.includes("openai")) ? ["chatgpt", "../assets/chatgpt-mark.png"] : null;
  if (logo) {
    mark.classList.add(logo[0]);
    const img = document.createElement("img"); img.src = logo[1]; img.alt = ""; mark.appendChild(img);
  } else {
    const initial = document.createElement("span"); initial.className = "initial";
    initial.textContent = (name[0] || "?").toUpperCase(); mark.appendChild(initial);
  }

  // El código, en fichas como en la app.
  const codeEl = $("code");
  codeEl.setAttribute("aria-label", code);
  [...code].forEach((ch, i) => {
    const tile = document.createElement("span");
    tile.className = ch === "-" ? "tile gap" : "tile";
    tile.style.setProperty("--i", i);
    tile.textContent = ch;
    codeEl.appendChild(tile);
  });

  const link = `growth://connect?code=${encodeURIComponent(code)}`;
  $("open").href = link;
  try { new QRCode($("qr"), { text: link, width: 264, height: 264, colorDark: "#0f3d27", colorLight: "#ffffff" }); } catch {}

  setState("wait");
  // Solo se consulta el propio servidor de Growth.
  let base;
  try { base = new URL(api); } catch {}
  if (!id || !base || base.protocol !== "https:" || !/\.supabase\.co$|(^|\.)growthapp\.me$/.test(base.hostname)) {
    setState("gone");
    return;
  }
  const poll = async () => {
    try {
      const reply = await (await fetch(`${base.href.replace(/\/$/, "")}/authorize/status?a=${encodeURIComponent(id)}`)).json();
      if (reply.status === "approved" || reply.status === "denied") {
        setState(reply.status === "approved" ? "ok" : "no");
        location.replace(reply.redirect);
        return;
      }
      if (reply.status === "expired") { setState("gone"); return; }
    } catch {}
    setTimeout(poll, 2000);
  };
  poll();
})();
</script>
</body>
</html>
