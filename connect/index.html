<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Growth · Conectar</title>
<link rel="icon" href="../assets/favicon.png">
<style>
:root{color-scheme:light dark;--bg:#f6f7f1;--ink:#14281d;--muted:#5a6a60;--line:#d9dfd3;--accent:#17482f;--lime:#c9f25d;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1f16;--ink:#eef3ea;--muted:#a3b3a8;--line:#29402f;--accent:#c9f25d;--card:#132a1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:56px 20px 64px}
h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.code{font:600 44px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;margin:28px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:24px;display:flex;gap:20px;align-items:center}
#qr{flex:none;background:#fff;padding:8px;border-radius:12px}
#qr img,#qr canvas{display:block;width:132px;height:132px}
.button{display:inline-block;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px;margin-top:8px}
.state{margin-top:28px;font-weight:600}
@media (max-width:520px){.card{flex-direction:column;align-items:flex-start}#qr{display:none}}
</style>
</head>
<body>
<main>
<h1 id="title">Conectar con Growth</h1>
<p class="muted" id="lead">Aprueba la conexión desde Growth en tu iPhone o Mac. Ahí eliges qué puede ver y hacer.</p>
<div class="code" id="code">····-····</div>
<div class="card">
  <div id="qr" aria-hidden="true"></div>
  <div>
    <p id="steps">Escanea el código con la cámara de tu iPhone, o abre Growth › Ajustes › Claude y ChatGPT y escribe el código.</p>
    <a class="button" id="open" href="#">Abrir Growth</a>
  </div>
</div>
<p class="state" id="state">Esperando tu permiso…</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const en = !navigator.language.toLowerCase().startsWith("es");
  const t = en ? {
    title: (n) => `Connect ${n} to Growth`, lead: "Approve it in Growth on your iPhone or Mac. That's where you choose what it can see and do.",
    steps: "Scan the code with your iPhone camera, or open Growth › Settings › Claude and ChatGPT and type the code.",
    open: "Open Growth", wait: "Waiting for your approval…", ok: "Connected. Taking you back…",
    no: "Not allowed. Taking you back…", gone: "This code expired. Start again from your assistant.",
  } : {
    title: (n) => `Conectar ${n} con Growth`, lead: "Apruébalo en Growth, en tu iPhone o Mac. Ahí eliges qué puede ver y hacer.",
    steps: "Escanea el código con la cámara de tu iPhone, o abre Growth › Ajustes › Claude y ChatGPT y escribe el código.",
    open: "Abrir Growth", wait: "Esperando tu permiso…", ok: "Conectado. Volviendo…",
    no: "No se permitió. Volviendo…", gone: "Este código venció. Vuelve a empezar desde tu asistente.",
  };
  const params = new URLSearchParams(location.search);
  const id = params.get("a"), code = params.get("c") || "", name = (params.get("n") || "tu asistente").slice(0, 80);
  const api = params.get("api") || "";
  const state = document.getElementById("state");
  document.getElementById("title").textContent = t.title(name);
  document.title = t.title(name);
  document.getElementById("lead").textContent = t.lead;
  document.getElementById("steps").textContent = t.steps;
  document.getElementById("code").textContent = code;
  const link = `growth://connect?code=${encodeURIComponent(code)}`;
  const open = document.getElementById("open");
  open.textContent = t.open;
  open.href = link;
  state.textContent = t.wait;
  try { new QRCode(document.getElementById("qr"), { text: link, width: 264, height: 264, colorDark: "#14281d", colorLight: "#ffffff" }); } catch {}
  // Solo se consulta el propio servidor de Growth.
  let base;
  try { base = new URL(api); } catch {}
  if (!id || !base || base.protocol !== "https:" || !/\.supabase\.co$|(^|\.)growthapp\.me$/.test(base.hostname)) {
    state.textContent = t.gone;
    return;
  }
  const poll = async () => {
    try {
      const reply = await (await fetch(`${base.href.replace(/\/$/, "")}/authorize/status?a=${encodeURIComponent(id)}`)).json();
      if (reply.status === "approved" || reply.status === "denied") {
        state.textContent = reply.status === "approved" ? t.ok : t.no;
        location.replace(reply.redirect);
        return;
      }
      if (reply.status === "expired") { state.textContent = t.gone; return; }
    } catch {}
    setTimeout(poll, 2000);
  };
  poll();
})();
</script>
</body>
</html>
